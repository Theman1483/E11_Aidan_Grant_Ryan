    var heatLayer = null, markerLayer = null, valLegend = null;

    function switchSensor(key, btn) {
        document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        if (heatLayer)   { map.removeLayer(heatLayer);   heatLayer   = null; }
        if (markerLayer) { map.removeLayer(markerLayer); markerLayer = null; }
        if (valLegend)   { map.removeControl(valLegend); valLegend   = null; }

        var info = sensors[key];
        var heatPts = info.markers.map(function(m) { return [m.lat, m.lon, m.norm]; });
        heatLayer = L.heatLayer(heatPts, {
            minOpacity:0.5, maxZoom:18, radius:15, blur:20, gradient:info.gradient
        }).addTo(map);

        markerLayer = L.layerGroup();
        info.markers.forEach(function(m) {
            L.circleMarker([m.lat, m.lon], {
                color:null, fill:true, fillColor:null, fillOpacity:0.0,
                radius:8, stroke:true, weight:3
            }).bindTooltip(
                "<b>" + m.val.toFixed(3) + " " + info.unit + "</b><br>" +
                m.t + "<br><span style='color:#aaa;font-size:10px'>" + m.seg + "</span>",
                {sticky:true}
            ).addTo(markerLayer);
        });
        markerLayer.addTo(map);

        var mid = ((info.vmin + info.vmax) / 2).toFixed(2);
        valLegend = L.control({ position:"bottomleft" });
        valLegend.onAdd = function() {
            var div = L.DomUtil.create("div","legend");
            div.innerHTML =
                "<b>" + info.label + " (" + info.unit + ")</b><br>" +
                "<div style='margin:6px 0 4px 0;width:160px;height:12px;" +
                "background:" + info.gradientCss + ";border-radius:3px'></div>" +
                "<div style='display:flex;justify-content:space-between;width:160px;font-size:11px'>" +
                "<span>" + info.vmin.toFixed(2) + "</span>" +
                "<span>" + mid + "</span>" +
                "<span>" + info.vmax.toFixed(2) + "</span></div>";
            return div;
        };
        valLegend.addTo(map);
    }

    var segLegend = L.control({ position:"bottomright" });
    segLegend.onAdd = function() {
        var div = L.DomUtil.create("div","legend");
        div.innerHTML =
            "<b>Segment</b><br>" +
            "<span class='legend-line' style='background:#00e676'></span> Above ground<br>" +
            "<span class='legend-line' style='background:#ff9800'></span> Underground<br>" +
            "<span class='legend-line' style='background:#e040fb'></span> Transbay tunnel";
        return div;
    };
    segLegend.addTo(map);

    switchSensor('temp', document.querySelector('.tab-btn'));
</script>
